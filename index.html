<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nowt</title>
  <link rel="stylesheet" href="css/main.css">
  <!-- Webfonts are progressive enhancement: if offline, the CSS font stacks
       fall back to native system sans / monospace faces. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Notes switcher (slides in from the left) -->
  <aside class="sidebar" id="sidebar" aria-label="Notes">
    <div class="sidebar__head">
      <span class="sidebar__title">Notes</span>
      <button type="button" class="js-new btn-text" aria-label="New note">+ New</button>
    </div>
    <div class="sidebar__search">
      <input type="search" id="search" placeholder="Search notes…" aria-label="Search notes" autocomplete="off">
    </div>
    <ul class="notes" id="notes"></ul>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main>
    <section>
      <div class="editor">
        <textarea autofocus name="message" class="editor__textarea" id="textarea" placeholder="Start writing…" aria-label="Note editor"></textarea>
      </div>

      <div class="preview" id="preview"></div>
    </section>
  </main>

  <div class="status" id="status" aria-live="polite"></div>

  <div class="toolbar">
    <button title="Notes (all your notes)" aria-label="Toggle notes list" type="button" class="js-notes btn btn--notes">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
    </button>
    <button title="Toggle pane (mobile)" aria-label="Toggle editor and preview pane" type="button" class="js-pane btn btn--pane">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
    </button>
    <button title="Toggle dark mode" aria-label="Toggle dark mode" type="button" class="js-theme btn btn--theme">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
    <button title="Save to file (Ctrl/⌘+S)" aria-label="Save note to file" type="button" class="js-save btn btn--save">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"></path><polyline points="8 12 12 16 16 12"></polyline><line x1="12" y1="2" x2="12" y2="16"></line></svg>
    </button>
  </div>

  <script src="js/vendor/marked.min.js"></script>
  <script src="js/vendor/dompurify.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
